name: 验证编译

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: 构建 Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 授权 Gradle Wrapper
        run: chmod +x ./gradlew

      - name: 构建 Debug APK
        run: ./gradlew assembleDebug --console=plain

      - name: 运行单元测试
        run: ./gradlew testDebugUnitTest --console=plain
